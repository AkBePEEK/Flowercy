name: flowery_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^11.0.0
  social_login_buttons: ^1.0.7
  shared_preferences: ^2.2.2

  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0

  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  http: ^1.2.0

  go_router: ^13.0.0
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.2
  retrofit: ^4.9.2
  json_annotation: ^4.12.0

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  mockito: ^5.6.4
  fake_cloud_firestore: ^4.1.1
  build_runner: ^2.15.0
  firebase_auth_mocks: ^0.15.2
  retrofit_generator: ^10.2.6
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/flowers/homeScreen/
    - assets/flowers/signInScreen/
    - assets/flowers/flowersCategory/
    - assets/flowers/products/
    - assets/flowers/
    - assets/flowers/shops/
    - assets/shopping_basket.png
    - assets/orderStatus/
    - assets/flowers/signUpScreen/